<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Segoe UI', system-ui, sans-serif">
  <rect width="1200" height="630" fill="#e7e6e0"/>

  <!-- soft periwinkle orb motif (right) -->
  <defs>
    <radialGradient id="orb" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#7d8bff"/>
      <stop offset="70%" stop-color="#5b6cff"/>
      <stop offset="100%" stop-color="#3a4ad6"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <circle cx="1010" cy="300" r="230" fill="url(#orb)"/>
  <circle cx="900" cy="150" r="46" fill="#111111"/>
  <circle cx="1070" cy="520" r="34" fill="#3b82f6" opacity="0.85"/>

  <!-- brand chip -->
  <g transform="translate(80,86)">
    <circle cx="20" cy="20" r="20" fill="#5b6cff"/>
    <text x="14" y="27" font-size="20" font-weight="700" fill="#ffffff">S</text>
    <text x="56" y="26" font-size="22" fill="#111111" opacity="0.7">swagata banerjee</text>
  </g>

  <!-- eyebrow -->
  <text x="82" y="250" font-size="22" letter-spacing="6" fill="#111111" opacity="0.55">FORWARD DEPLOYED ENGINEER · KOLKATA, IN</text>

  <!-- name -->
  <text x="76" y="360" font-size="128" font-weight="700" letter-spacing="-3" fill="#111111">SWAGATA</text>
  <text x="76" y="478" font-size="128" font-weight="700" letter-spacing="-3" fill="#5b6cff">BANERJEE</text>

  <!-- tagline -->
  <text x="82" y="552" font-size="26" fill="#111111" opacity="0.7">AI-driven products &amp; data platforms · Interactive 3D portfolio</text>
</svg>
